# All writable paths are under /tmp so the root filesystem can stay read-only.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  keepalive_requests 10000;
  default_type application/octet-stream;

  # JSON access log. "remote" is the source address the provider actually sees:
  #   PrivateLink -> an NLB address (client IP is NOT preserved)
  #   VPC Lattice -> a link-local Lattice address (169.254.171.0/24 or fd00:ec2:80::/64)
  # Lattice adds identity headers (source VPC, caller principal) that PrivateLink cannot.
  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
    '"server_addr":"$server_addr","xff":"$http_x_forwarded_for",'
    '"lattice_source_vpc":"$http_x_amzn_source_vpc",'
    '"lattice_identity":"$http_x_amzn_lattice_identity",'
    '"lattice_network":"$http_x_amzn_lattice_network",'
    '"host_header":"$host","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"task":"$hostname"}';
  access_log /dev/stdout json;

  server {
    # Dual-stack listener: works in dual-stack and IPv6-only subnets.
    listen 8080 reuseport;
    listen [::]:8080 reuseport;
    root /usr/share/nginx/html;

    location = /health { access_log off; return 200 "ok\n"; }

    # What does the provider see? Used by the security / identity scenarios.
    location = /whoami {
      default_type application/json;
      return 200 '{"remote":"$remote_addr","server_addr":"$server_addr","xff":"$http_x_forwarded_for","lattice_source_vpc":"$http_x_amzn_source_vpc","lattice_identity":"$http_x_amzn_lattice_identity","task":"$hostname"}\n';
    }

    location = / { return 200 "netbench $hostname\n"; }
    location / {
      limit_except GET HEAD { deny all; }
      try_files $uri =404;
    }
  }
}
