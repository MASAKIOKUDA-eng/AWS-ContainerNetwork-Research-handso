AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  IPv6 container network lab - provider platform.
  ECR, ECS cluster, IAM, dual-stack internal NLB + PrivateLink endpoint service,
  VPC Lattice service network / service / target group / auth policies / access logs.

Parameters:
  Prefix:
    Type: String
    Default: v6lab
    AllowedPattern: "^[a-z0-9-]{3,16}$"
  LatticeAuthMode:
    Type: String
    Default: vpc-only
    AllowedValues: [vpc-only, iam-required]
    Description: >-
      vpc-only = anonymous requests are allowed but only from the consumer VPC.
      iam-required = requests must also be SigV4-signed by a principal of this account (security test X-3).
  NlbEnforceSgOnPrivateLink:
    Type: String
    Default: "off"
    AllowedValues: ["on", "off"]
    Description: Whether the NLB security group rules are evaluated for PrivateLink traffic.
  ProviderWorkloadIpMode:
    Type: String
    Default: dualstack
    AllowedValues: [dualstack, ipv6only]
    Description: Must match WorkloadIpMode of the provider VPC stack. Decides the target IP family.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]

Conditions:
  IamRequired: !Equals [!Ref LatticeAuthMode, iam-required]
  # Target address family follows the provider workload subnets:
  # dual-stack tasks are registered by IPv4, IPv6-only tasks by IPv6.
  ProviderIpv6Only: !Equals [!Ref ProviderWorkloadIpMode, ipv6only]

Resources:
  # ---------------------------------------------------------------- ECR (images are pinned by digest, scanned on push)
  NetbenchRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${Prefix}/netbench"
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: KMS }
      EmptyOnDelete: true
      Tags:
        - { Key: Project, Value: !Ref Prefix }
  LoadgenRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${Prefix}/loadgen"
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: KMS }
      EmptyOnDelete: true
      Tags:
        - { Key: Project, Value: !Ref Prefix }

  # ---------------------------------------------------------------- ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref Prefix
      ClusterSettings:
        - { Name: containerInsights, Value: enhanced }
      Tags:
        - { Key: Project, Value: !Ref Prefix }

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${Prefix}/app"
      RetentionInDays: !Ref LogRetentionDays

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" }
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"

  # The server does not call AWS APIs: the task role has no permissions on purpose.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" }

  # ECS registers / deregisters tasks in the VPC Lattice target group with this role.
  EcsLatticeInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" }
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonECSInfrastructureRolePolicyForVpcLattice"

  # ---------------------------------------------------------------- Security groups (provider VPC)
  NlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal dual-stack NLB (PrivateLink front door)
      VpcId: !ImportValue { "Fn::Sub": "${Prefix}-provider-VpcId" }
      Tags:
        - { Key: Name, Value: !Sub "${Prefix}-provider-nlb" }
        - { Key: Project, Value: !Ref Prefix }

  TaskSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Provider ECS tasks (netbench)
      VpcId: !ImportValue { "Fn::Sub": "${Prefix}-provider-VpcId" }
      SecurityGroupIngress:
        # VPC Lattice reaches targets from its link-local ranges
        # (same ranges as the managed prefix lists com.amazonaws.<region>.vpc-lattice / .ipv6.vpc-lattice).
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: 169.254.171.0/24, Description: VPC Lattice IPv4 }
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIpv6: "fd00:ec2:80::/64", Description: VPC Lattice IPv6 }
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: VPC endpoints (no internet route) }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0", Description: VPC endpoints (no internet route) }
      Tags:
        - { Key: Name, Value: !Sub "${Prefix}-provider-task" }
        - { Key: Project, Value: !Ref Prefix }

  # Baseline client inside the provider VPC (k6 as a one-off Fargate task, scenario S-0).
  BaselineSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Baseline load generator task in the provider VPC
      VpcId: !ImportValue { "Fn::Sub": "${Prefix}-provider-VpcId" }
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: VPC endpoints (no internet route) }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0", Description: VPC endpoints (no internet route) }
      Tags:
        - { Key: Name, Value: !Sub "${Prefix}-provider-baseline" }
        - { Key: Project, Value: !Ref Prefix }

  NlbIngressFromBaseline:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NlbSg
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref BaselineSg
      Description: HTTP from the baseline client
  BaselineEgressToNlb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref BaselineSg
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      DestinationSecurityGroupId: !Ref NlbSg
      Description: HTTP to the NLB
  NlbEgressToTask:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref NlbSg
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId: !Ref TaskSg
      Description: NLB to tasks (traffic and health checks)
  TaskIngressFromNlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSg
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref NlbSg
      Description: From the NLB (traffic and health checks)

  # ---------------------------------------------------------------- PrivateLink: dual-stack NLB + endpoint service
  Nlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${Prefix}-nlb"
      Type: network
      Scheme: internal
      IpAddressType: dualstack
      Subnets:
        - !ImportValue { "Fn::Sub": "${Prefix}-provider-EdgeSubnetA" }
        - !ImportValue { "Fn::Sub": "${Prefix}-provider-EdgeSubnetB" }
      SecurityGroups: [!Ref NlbSg]
      EnforceSecurityGroupInboundRulesOnPrivateLinkTraffic: !Ref NlbEnforceSgOnPrivateLink
      LoadBalancerAttributes:
        - { Key: load_balancing.cross_zone.enabled, Value: "true" }
      Tags:
        - { Key: Project, Value: !Ref Prefix }

  NlbTg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${Prefix}-pl"
      TargetType: ip
      Protocol: TCP
      Port: 8080
      IpAddressType: !If [ProviderIpv6Only, ipv6, ipv4]
      VpcId: !ImportValue { "Fn::Sub": "${Prefix}-provider-VpcId" }
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }
      Tags:
        - { Key: Project, Value: !Ref Prefix }

  NlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Nlb
      Port: 80
      Protocol: TCP
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref NlbTg }]

  # Security: acceptance required + only this account may connect.
  EndpointService:
    Type: AWS::EC2::VPCEndpointService
    Properties:
      AcceptanceRequired: true
      NetworkLoadBalancerArns: [!Ref Nlb]
      SupportedIpAddressTypes: [ipv4, ipv6]
      Tags:
        - { Key: Project, Value: !Ref Prefix }

  EndpointServicePermissions:
    Type: AWS::EC2::VPCEndpointServicePermissions
    Properties:
      ServiceId: !Ref EndpointService
      AllowedPrincipals:
        - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"

  # ---------------------------------------------------------------- VPC Lattice
  ServiceNetwork:
    Type: AWS::VpcLattice::ServiceNetwork
    Properties:
      Name: !Sub "${Prefix}-sn"
      AuthType: AWS_IAM
      Tags:
        - { Key: Project, Value: !Ref Prefix }

  # Service network policy: only requests coming from the consumer VPC (coarse-grained guardrail).
  ServiceNetworkAuthPolicy:
    Type: AWS::VpcLattice::AuthPolicy
    Properties:
      ResourceIdentifier: !Ref ServiceNetwork
      Policy:
        Version: "2012-10-17"
        Statement:
          - Sid: OnlyFromConsumerVpc
            Effect: Allow
            Principal: "*"
            Action: vpc-lattice-svcs:Invoke
            Resource: "*"
            Condition:
              StringEquals:
                "vpc-lattice-svcs:SourceVpc": !ImportValue { "Fn::Sub": "${Prefix}-consumer-VpcId" }

  LatticeService:
    Type: AWS::VpcLattice::Service
    Properties:
      Name: !Sub "${Prefix}-netbench"
      AuthType: AWS_IAM
      Tags:
        - { Key: Project, Value: !Ref Prefix }

  # Service policy: fine-grained. vpc-only allows anonymous callers from the consumer VPC,
  # iam-required additionally needs a SigV4-signed principal of this account.
  LatticeServiceAuthPolicy:
    Type: AWS::VpcLattice::AuthPolicy
    Properties:
      ResourceIdentifier: !Ref LatticeService
      Policy: !If
        - IamRequired
        - Version: "2012-10-17"
          Statement:
            - Sid: SignedCallersOfThisAccountFromConsumerVpc
              Effect: Allow
              Principal: "*"
              Action: vpc-lattice-svcs:Invoke
              Resource: "*"
              Condition:
                StringEquals:
                  "vpc-lattice-svcs:SourceVpc": !ImportValue { "Fn::Sub": "${Prefix}-consumer-VpcId" }
                  "aws:PrincipalAccount": !Ref "AWS::AccountId"
                StringNotEqualsIgnoreCase:
                  "aws:PrincipalType": anonymous
        - Version: "2012-10-17"
          Statement:
            - Sid: AnyCallerFromConsumerVpc
              Effect: Allow
              Principal: "*"
              Action: vpc-lattice-svcs:Invoke
              Resource: "*"
              Condition:
                StringEquals:
                  "vpc-lattice-svcs:SourceVpc": !ImportValue { "Fn::Sub": "${Prefix}-consumer-VpcId" }

  LatticeTg:
    Type: AWS::VpcLattice::TargetGroup
    Properties:
      Name: !Sub "${Prefix}-lattice"
      Type: IP
      Config:
        Port: 8080
        Protocol: HTTP
        ProtocolVersion: HTTP1
        IpAddressType: !If [ProviderIpv6Only, IPV6, IPV4]
        VpcIdentifier: !ImportValue { "Fn::Sub": "${Prefix}-provider-VpcId" }
        HealthCheck:
          Enabled: true
          Protocol: HTTP
          Path: /health
          HealthCheckIntervalSeconds: 10
          HealthyThresholdCount: 2
          UnhealthyThresholdCount: 2
      Tags:
        - { Key: Project, Value: !Ref Prefix }

  # HTTP listener: apples-to-apples with the PrivateLink path (plain TCP/HTTP).
  LatticeHttpListener:
    Type: AWS::VpcLattice::Listener
    Properties:
      ServiceIdentifier: !Ref LatticeService
      Name: http
      Protocol: HTTP
      Port: 80
      DefaultAction:
        Forward:
          TargetGroups:
            - { TargetGroupIdentifier: !Ref LatticeTg, Weight: 100 }

  # HTTPS listener with the AWS-provided certificate of the generated *.on.aws name.
  LatticeHttpsListener:
    Type: AWS::VpcLattice::Listener
    Properties:
      ServiceIdentifier: !Ref LatticeService
      Name: https
      Protocol: HTTPS
      Port: 443
      DefaultAction:
        Forward:
          TargetGroups:
            - { TargetGroupIdentifier: !Ref LatticeTg, Weight: 100 }

  ServiceNetworkServiceAssociation:
    Type: AWS::VpcLattice::ServiceNetworkServiceAssociation
    Properties:
      ServiceNetworkIdentifier: !Ref ServiceNetwork
      ServiceIdentifier: !Ref LatticeService

  # Access logs show auth decisions, source VPC, caller principal and target latency.
  LatticeAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/${Prefix}/lattice"
      RetentionInDays: !Ref LogRetentionDays

  LatticeAccessLogs:
    Type: AWS::VpcLattice::AccessLogSubscription
    Properties:
      ResourceIdentifier: !Ref ServiceNetwork
      DestinationArn: !GetAtt LatticeAccessLogGroup.Arn

Outputs:
  ClusterName:
    Value: !Ref Cluster
    Export: { Name: !Sub "${Prefix}-ClusterName" }
  AppLogGroupName:
    Value: !Ref AppLogGroup
    Export: { Name: !Sub "${Prefix}-AppLogGroup" }
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
    Export: { Name: !Sub "${Prefix}-TaskExecutionRoleArn" }
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
    Export: { Name: !Sub "${Prefix}-TaskRoleArn" }
  EcsLatticeInfrastructureRoleArn:
    Value: !GetAtt EcsLatticeInfrastructureRole.Arn
    Export: { Name: !Sub "${Prefix}-EcsLatticeInfrastructureRoleArn" }
  TaskSg:
    Value: !Ref TaskSg
    Export: { Name: !Sub "${Prefix}-provider-TaskSg" }
  BaselineSg:
    Value: !Ref BaselineSg
    Export: { Name: !Sub "${Prefix}-provider-BaselineSg" }
  NetbenchRepoUri:
    Value: !GetAtt NetbenchRepo.RepositoryUri
  LoadgenRepoUri:
    Value: !GetAtt LoadgenRepo.RepositoryUri
  LoadgenRepoArn:
    Value: !GetAtt LoadgenRepo.Arn
    Export: { Name: !Sub "${Prefix}-LoadgenRepoArn" }
  NlbDnsName:
    Value: !GetAtt Nlb.DNSName
  NlbTgArn:
    Value: !Ref NlbTg
    Export: { Name: !Sub "${Prefix}-NlbTgArn" }
  EndpointServiceId:
    Value: !Ref EndpointService
  EndpointServiceName:
    Value: !Sub "com.amazonaws.vpce.${AWS::Region}.${EndpointService}"
    Export: { Name: !Sub "${Prefix}-EndpointServiceName" }
  ServiceNetworkId:
    Value: !GetAtt ServiceNetwork.Id
    Export: { Name: !Sub "${Prefix}-ServiceNetworkId" }
  LatticeServiceArn:
    Value: !GetAtt LatticeService.Arn
    Export: { Name: !Sub "${Prefix}-LatticeServiceArn" }
  LatticeServiceDns:
    Value: !GetAtt LatticeService.DnsEntry.DomainName
  LatticeTgArn:
    Value: !GetAtt LatticeTg.Arn
    Export: { Name: !Sub "${Prefix}-LatticeTgArn" }
  LatticeAccessLogGroupName:
    Value: !Ref LatticeAccessLogGroup
